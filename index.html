<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorldMind</title>
<link rel="manifest" href="wm-manifest.webmanifest">
<meta name="theme-color" content="#050506">
<link rel="icon" type="image/png" href="wm-icon-192.png">
<link rel="apple-touch-icon" href="wm-apple-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorldMind">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Cesium.js" as="script">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500..800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Jost:wght@300&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">   <!-- [2.3] yazı tipi indirilirken sayfa beklemez -->
<link href="https://cdn.jsdelivr.net/npm/cesium@1.121.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* Layout: tam ekran dünya; üstünde cam paneller (tablette sol ray, telefonda alt çekmece); yaklaştırmada tam ekran hedefleme HUD'u */
:root{
  --void:#05070a; --glass:rgba(10,15,25,.85); --glass-2:rgba(12,19,31,.9); --glass-3:rgba(16,26,42,.7);
  --line:rgba(120,200,255,.15); --line-2:rgba(120,200,255,.3); --ink:#eaf2f8; --mute:#7f93a8; --soft:#a9bccd;
  --signal:#7dd8ff; --signal-glow:rgba(125,216,255,.35); --hud:#8ce4ff; --hud-dim:rgba(140,228,255,.35);
  --c-catisma:#e5484d; --c-protesto:#f2a33a; --c-siyaset:#9a88f5; --c-afet:#3fb5c9; --c-diger:#9aa4b2;
  --f-ui:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --l:max(12px, env(safe-area-inset-left,0px)); --r:max(12px, env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font:14px/1.45 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#globe{position:fixed;inset:0}
.cesium-widget-credits{font-size:10px!important;opacity:.7}

/* üst bar */
.bar{position:fixed;top:calc(var(--top) + 10px);left:var(--l);right:var(--r);z-index:5;display:flex;align-items:center;gap:10px;
  padding:8px 10px 8px 14px;background:var(--glass);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-weight:800;letter-spacing:.14em;font-size:15px}
.brand span{font-family:var(--f-data);font-size:11px;color:var(--signal)}
.live{display:flex;align-items:center;gap:6px;font-family:var(--f-data);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--signal);animation:ping 2s infinite;flex:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(125,216,255,.55)}70%{box-shadow:0 0 0 8px rgba(125,216,255,0)}100%{box-shadow:0 0 0 0 rgba(125,216,255,0)}}
.spacer{flex:1}
.tbtn{border:1px solid var(--line);background:var(--glass-2);border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.tbtn[aria-pressed="true"]{border-color:var(--signal);color:var(--signal)}
#listBtn{display:none}

/* kategori çipleri */
.chips{position:fixed;top:calc(var(--top) + 64px);left:var(--l);right:var(--r);z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;transition:opacity .3s}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);
  border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip em{font-style:normal;font-family:var(--f-data);font-size:11px;color:var(--mute)}
.chip[aria-pressed="false"]{opacity:.55}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb, var(--c) 18%, var(--glass));opacity:1}
.act-chip{margin-left:6px}
.pulse{animation:ping 2s infinite}

/* liste paneli */
#panel{position:fixed;z-index:4;left:var(--l);top:calc(var(--top) + 108px);bottom:calc(var(--bot) + 34px);width:340px;
  display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);overflow:hidden;transition:opacity .3s}
.phead{padding:12px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.grab{display:none}
#q{width:100%;background:var(--glass-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink);font:14px var(--f-ui)}
#q::placeholder{color:var(--mute)}
.srcs{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-data);font-size:10.5px;color:var(--mute)}
.srcs .ok{color:#7fd3a0}.srcs .err{color:var(--c-catisma)}.srcs .busy{color:var(--signal)}
.srcs small{opacity:.7}
#list{list-style:none;margin:0;padding:4px 0;overflow-y:auto;flex:1;min-height:0}
#list li > button{width:100%;text-align:left;background:none;border:0;padding:10px 12px;display:grid;grid-template-columns:10px 1fr;gap:4px 10px;cursor:pointer;border-bottom:1px solid rgba(150,172,196,.07)}
#list li > button:hover,#list li > button[aria-current="true"]{background:rgba(150,172,196,.08)}
#list .k{grid-row:span 2;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--c)}
#list .t{font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
#list .m{font-family:var(--f-data);font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#list .m b.new{color:#fff;font-weight:500;letter-spacing:.06em}
.st{font-family:var(--f-data);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.st.on{color:#ff6b70}.st.off{color:var(--mute)}
.empty{padding:24px 14px;color:var(--mute);text-align:center}

/* detay kartı */
#card{position:fixed;z-index:6;right:var(--r);top:calc(var(--top) + 108px);width:370px;max-height:calc(100% - var(--top) - var(--bot) - 150px);overflow-y:auto;
  background:var(--glass-2);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(12px);padding:14px 16px 16px;display:grid;gap:10px;transition:opacity .3s}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-family:var(--f-data);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.alert{font-family:var(--f-data);font-size:10.5px;color:var(--mute)}
.x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--mute);padding:0 4px}
#card h2{margin:0;font-size:17px;line-height:1.3;text-wrap:balance}
.meta .why{color:#8ce4ff}
.orig{font-size:12px;color:var(--mute);line-height:1.35}
.tx{font-family:var(--f-data);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.meta{font-family:var(--f-data);font-size:11.5px;color:var(--mute);display:grid;gap:2px}
.arts{margin:0;padding:0;list-style:none;display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.arts a{color:var(--ink);text-decoration:none;font-size:13px;line-height:1.35}
.arts a:hover{color:var(--signal)}
.arts small{display:block;font-family:var(--f-data);font-size:10px;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.more{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.more h3{margin:0;font:600 10.5px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--signal)}
.more p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink)}
.more .wk{display:grid;gap:6px}
.more .wk b{font-size:13.5px}
.more .wk img{float:right;width:84px;height:84px;object-fit:cover;border-radius:6px;margin:0 0 6px 10px}
.more a{color:var(--signal);text-decoration:none;font-size:12.5px}
.more ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.more li button{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:13px;line-height:1.35;color:var(--ink)}
.more li button small{display:block;font-family:var(--f-data);font-size:10px;color:var(--mute)}
.more .wait{font-family:var(--f-data);font-size:11px;color:var(--mute)}
.act{flex:1;min-width:130px;text-align:center;border-radius:8px;padding:9px 10px;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:rgba(150,172,196,.08);color:var(--ink)}
.act.main{background:var(--signal);border-color:var(--signal);color:#1a1205;font-family:var(--f-data);letter-spacing:.1em;text-transform:uppercase;font-size:12.5px}

/* yaklaşma ekranı: sade, ince, büyük yer adı */
#hud{position:fixed;inset:0;z-index:7;pointer-events:none;color:var(--ink);transition:opacity .5s}
#hud .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 50%, rgba(4,6,9,.6) 100%)}
.reticle{position:absolute;left:50%;top:50%;width:min(40vmin,220px);aspect-ratio:1;transform:translate(-50%,-50%) scale(1.25);max-width:100%;color:rgba(255,255,255,.85);
  transition:transform 6.5s cubic-bezier(.3,.6,.2,1), opacity .9s ease}
#hud.go .reticle{transform:translate(-50%,-50%) scale(.6)}
#hud.arrived .reticle{opacity:0;transform:translate(-50%,-50%) scale(.45);transition:opacity .9s ease, transform .9s ease}
.reticle svg{width:100%;height:100%;overflow:visible}
.reticle .ring{transform-origin:100px 100px;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hud-title{position:absolute;left:0;right:0;top:calc(var(--top) + 84px);display:grid;justify-items:center;gap:6px;text-align:center;padding-inline:24px;
  opacity:0;transform:translateY(-6px);transition:opacity .8s ease .2s, transform .8s ease .2s}
#hud.on .hud-title{opacity:1;transform:none}
.hud-kicker{font:500 10.5px var(--f-data);letter-spacing:.32em;text-transform:uppercase;color:var(--signal)}
.hud-title h1{margin:0;font:800 clamp(28px,6vw,56px)/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.hud-coord{font:400 11.5px var(--f-data);letter-spacing:.14em;color:rgba(233,238,243,.75)}
.hud-prog{position:absolute;left:50%;bottom:calc(var(--bot) + 64px);transform:translateX(-50%);display:flex;gap:6px;width:min(240px,60vw)}
.hud-prog i{flex:1;height:2px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.hud-prog i::after{content:"";position:absolute;inset:0;background:var(--signal);transform:scaleX(0);transform-origin:left;transition:transform var(--d,2s) ease}
.hud-prog i.f::after{transform:scaleX(1)}
#hud.arrived .hud-prog{opacity:0;transition:opacity .6s}
.hud-read{position:absolute;left:50%;bottom:calc(var(--bot) + 28px);transform:translateX(-50%);font:400 11px var(--f-data);letter-spacing:.14em;
  color:rgba(233,238,243,.8);white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#hudExit{pointer-events:auto;position:absolute;left:var(--l);bottom:calc(var(--bot) + 20px);font:500 12px var(--f-data);letter-spacing:.1em;
  color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;backdrop-filter:blur(10px)}

#tv{position:fixed;z-index:8;left:calc(var(--l) + 352px);bottom:calc(var(--bot) + 34px);width:min(440px, calc(100% - 760px));min-width:300px;
  background:var(--glass-2);border:1px solid var(--line);border-radius:12px;overflow:hidden;backdrop-filter:blur(12px);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.tvbar{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;min-width:0}
.tvlive{font:600 10px var(--f-data);letter-spacing:.14em;color:#fff;background:#e5484d;padding:2px 6px;border-radius:4px;flex:none}
#tvTitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#tvOpen{color:var(--signal);text-decoration:none;font-size:11.5px;white-space:nowrap}
#tvClose{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
#tvBody{aspect-ratio:16/9;background:#000;max-width:100%}
#tvBody iframe,#tvBody video{width:100%;height:100%;border:0;display:block}
.vids{display:grid;gap:8px}
.vid{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.vid img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#000}
.vid span{font-size:12.5px;line-height:1.3;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.vid small{display:block;font-family:var(--f-data);font-size:10px;color:var(--mute)}
.chans{display:flex;flex-wrap:wrap;gap:6px}.chans .act{flex:0 1 auto;min-width:0;padding:7px 10px;font-size:12px}
.act.hasvid{border-color:var(--c-catisma)}
#picker{position:fixed;z-index:9;width:min(320px, calc(100% - 16px));max-height:min(360px, 60%);overflow-y:auto;background:var(--glass-2);
  border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.45);padding:4px 0}
#picker .pk-h{font:500 10.5px var(--f-data);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:6px 12px 4px}
#picker button{display:grid;grid-template-columns:9px 1fr;gap:9px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;cursor:pointer;color:var(--ink)}
#picker button:hover{background:rgba(150,172,196,.08)}
#picker i{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:5px}
#picker span{font-size:12.5px;line-height:1.3;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#picker small{display:block;font-family:var(--f-data);font-size:10px;color:var(--mute)}
#toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 44px);background:var(--glass-2);border:1px solid var(--line);
  border-radius:10px;padding:9px 14px;font-size:13px;max-width:calc(100% - 32px)}
/* ===== 1.2 arayüz: PDF tasarım dili (karanlık, turkuaz, istihbarat panosu) ===== */
.bar,#panel,#card,.chip,#picker,#tv,#toast{backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.bar{padding:6px 8px 6px 16px;border-radius:14px;border-color:var(--line);background:var(--glass);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.brand b{font:800 15px var(--f-ui);letter-spacing:.2em;color:#fff}
.brand span{color:var(--signal)}
.live{color:var(--mute);letter-spacing:.04em}
.tbtn{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font:500 11px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);transition:border-color .2s, color .2s, box-shadow .2s}
.tbtn:hover{border-color:var(--line-2);color:#fff;box-shadow:0 0 14px var(--signal-glow)}
.tbtn[aria-pressed="true"]{border-color:var(--signal);color:var(--signal)}
.chip{background:var(--glass);border-color:var(--line);padding:6px 12px;font:500 11px var(--f-data);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.chip i{width:6px;height:6px}
.chip em{color:var(--mute);font-size:10.5px}
.chip[aria-pressed="false"]{opacity:.7}
.chip[aria-pressed="true"]{color:#fff;border-color:var(--line-2);background:var(--glass-3);box-shadow:inset 0 0 0 1px rgba(125,216,255,.06)}
#panel{border-radius:14px;border-color:var(--line);background:var(--glass);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.phead{padding:12px 12px 10px;gap:9px;border-bottom-color:var(--line)}
#q{background:rgba(5,9,15,.7);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:400 13px var(--f-ui);transition:border-color .2s, box-shadow .2s}
#q:focus{outline:none;border-color:var(--line-2);box-shadow:0 0 0 3px rgba(125,216,255,.08)}
.srcs{font-size:10px;letter-spacing:.02em;gap:3px 12px}
.srcs .ok{color:var(--soft)}.srcs .ok::first-letter{color:var(--signal)}
#list li > button{padding:11px 14px 11px 12px;grid-template-columns:2px 1fr;gap:3px 12px;border-bottom:1px solid rgba(120,200,255,.06)}
#list li > button:hover{background:rgba(125,216,255,.04)}
#list li > button[aria-current="true"]{background:rgba(125,216,255,.07)}
#list .k{width:2px;height:auto;min-height:30px;border-radius:2px;margin-top:2px;opacity:.9}
#list .t{font:600 13px/1.32 var(--f-ui);color:#fff}
#list .m{font:400 10px var(--f-data);color:var(--mute);letter-spacing:.02em}
.st.on{color:var(--signal)}.st.off{color:var(--mute)}
#card{border-radius:14px;border-color:var(--line);background:var(--glass-2);padding:16px 18px 18px;gap:12px;box-shadow:0 14px 50px rgba(0,0,0,.45)}
#card h2{font:800 18px/1.28 var(--f-ui);color:#fff;letter-spacing:.005em;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.pill{font:500 10px var(--f-data);letter-spacing:.12em;padding:3px 9px;background:rgba(5,9,15,.5)}
.meta{font:400 11px/1.6 var(--f-data);color:var(--mute);gap:1px}
.meta .why{color:var(--signal)}
.orig{color:var(--mute)}
.arts{border-top-color:var(--line)}
.arts a:hover{color:var(--signal)}
.acts{gap:8px}
.act{flex:1;min-width:130px;background:rgba(5,9,15,.55);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 11px var(--f-data);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);transition:border-color .2s, color .2s, box-shadow .2s, background .2s}
.act:hover,.act:focus-visible{border-color:var(--signal);color:#fff;background:rgba(125,216,255,.06);box-shadow:0 0 16px var(--signal-glow), inset 0 0 10px rgba(125,216,255,.08);outline:none}
.act.main{background:rgba(125,216,255,.08);border-color:rgba(125,216,255,.55);color:var(--signal);font:600 11px var(--f-data);letter-spacing:.16em}
.act.main:hover{background:rgba(125,216,255,.14);color:#fff}
.more{border-top-color:var(--line)}
.more h3{color:var(--signal);letter-spacing:.16em}
.more p{color:var(--soft)}
.more a{color:var(--signal)}
.x{color:var(--mute)}.x:hover{color:#fff}
#hudExit{background:var(--glass);border-color:var(--line);font:500 11px var(--f-data);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
#hudExit:hover{border-color:var(--signal);color:#fff;box-shadow:0 0 14px var(--signal-glow)}
#toast{border-color:var(--line);font:400 12.5px var(--f-ui)}

/* ===== 3) Yaklaşma bittiğinde kart: HUD başlığı ve nişangâhla asla çakışmaz (sağ alt köşe) ===== */
body.engaged.arrived #card{top:auto;bottom:calc(var(--bot) + 20px);right:var(--r);left:auto;
  width:min(360px, 40vw);max-height:45vh}
body.engaged.arrived .hud-read{left:calc(var(--l) + 4px);transform:none;bottom:calc(var(--bot) + 70px)}

/* açılış ekranı: WORLDMIND logosu (tel küre + nokta ızgarası + mavi düğümler) */
#splash{position:fixed;inset:0;z-index:30;display:grid;place-content:center;justify-items:center;gap:clamp(18px,4vh,40px);background-color:#04070a;
  transition:background-color 1.2s ease}
#spCanvas{transition:transform .8s cubic-bezier(.4,0,.2,1), opacity 1.4s ease}
.sp-word{transition:opacity .6s ease, transform .8s ease, letter-spacing .9s ease}
.sp-open{margin-top:clamp(4px,2vh,18px);font:500 13px var(--f-data);letter-spacing:.5em;padding:12px 26px 12px calc(26px + .5em);color:#e9fbff;cursor:pointer;
  background:rgba(120,215,250,.08);border:1px solid rgba(150,232,255,.65);border-radius:999px;
  box-shadow:0 0 18px rgba(120,215,250,.35), inset 0 0 12px rgba(120,215,250,.15);opacity:0;transform:translateY(8px);
  animation:spOpenIn 1s ease forwards, spOpenPulse 2.4s 1s ease-in-out infinite;transition:background .2s, box-shadow .2s}
.sp-open:hover,.sp-open:focus-visible{background:rgba(120,215,250,.18);box-shadow:0 0 30px rgba(120,215,250,.6), inset 0 0 14px rgba(120,215,250,.25);outline:none}
@keyframes spOpenIn{to{opacity:1;transform:none}}
@keyframes spOpenPulse{0%,100%{box-shadow:0 0 14px rgba(120,215,250,.3), inset 0 0 10px rgba(120,215,250,.12)}50%{box-shadow:0 0 34px rgba(120,215,250,.7), inset 0 0 16px rgba(120,215,250,.3)}}
#splash.morph .sp-open{opacity:0;transform:translateY(14px);transition:opacity .4s, transform .5s;animation:none}
/* 1) hizala: yazı kaybolur, logo küresi ekranın ortasına kayar (arkada dünya aynı boyutta hazırlanır) */
#splash.morph .sp-word{opacity:0;transform:translateY(14px);letter-spacing:.9em}
#splash.morph #spCanvas{transform:translateY(var(--dy,0px))}
/* 2) dönüş: siyah zemin çekilir, logo erir, aynı yerde gerçek dünya görünür */
#splash.reveal{background-color:rgba(5,5,6,0);pointer-events:none}
#splash.reveal #spCanvas{opacity:0}
#spCanvas{width:min(64vmin,440px);aspect-ratio:1;max-width:90vw}
.sp-word{display:flex;padding-left:.62em;font:300 clamp(24px,5vw,46px)/1 "Jost", "Archivo", sans-serif;color:#eef1f4;letter-spacing:.62em}
.sp-word span{display:inline-block;opacity:0;transform:translateY(8px);filter:blur(5px);animation:spLetter 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spLetter{to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.sp-word span{animation-duration:.01s!important;animation-delay:0s!important}}
#fatal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;text-align:center;background:var(--void)}
#fatal p{max-width:40ch;color:var(--mute)}

/* telefon / dar ekran */
@media (max-width:760px){
  #listBtn{display:inline-block}
  .live .lbl, .brand span{display:none}
  #panel{left:0;right:0;width:auto;top:auto;bottom:0;height:46%;border-radius:16px 16px 0 0;border-bottom:0;padding-bottom:var(--bot);transition:transform .25s ease, opacity .3s}
  body.sheet-closed #panel{transform:translateY(calc(100% - 46px - var(--bot)))}
  .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px}
  .phead{padding-top:8px}
  #card{left:var(--l);right:var(--r);width:auto;top:auto;bottom:calc(46% + 10px);max-height:42%}
  #tv{left:var(--l);right:var(--r);width:auto;min-width:0;bottom:auto;top:calc(var(--top) + 108px)}
  body.sheet-closed #card, body.engaged.arrived #card{bottom:calc(var(--bot) + 56px);max-height:50%}
  .cesium-viewer-bottom{bottom:auto!important;top:calc(var(--top) + 104px)!important;left:var(--l)!important}
  .hud-read{display:none}
  .hud-title{top:calc(var(--top) + 70px)}
}
@media (max-width:760px){
  .cesium-widget-credits, .cesium-viewer-bottom{display:none!important}
  .bar{gap:6px;padding:6px 6px 6px 12px}
  .brand{flex:none}.brand b{font-size:13px;letter-spacing:.12em}
  .live{display:none}
  .tbtn{padding:6px 8px;font-size:10px;letter-spacing:.05em;flex:none}
  .chips{z-index:5}
  #panel{z-index:6;bottom:0;height:46%;max-height:calc(100% - var(--top) - 112px)}
  #card{z-index:7;bottom:calc(46% + 10px);max-height:calc(54% - var(--top) - 124px)}
  body.sheet-closed #card{bottom:calc(var(--bot) + 56px);max-height:calc(100% - var(--top) - var(--bot) - 180px)}
  body.engaged.arrived #card{left:var(--l);right:var(--r);width:auto;bottom:calc(var(--bot) + 66px);max-height:calc(100% - var(--top) - var(--bot) - 260px)}
  body.engaged.arrived .hud-read{display:none}
  #tv{z-index:8}
  #tv{top:calc(var(--top) + 108px)}
  #toast{bottom:auto;top:calc(var(--top) + 112px);z-index:9;left:var(--l);right:var(--r);transform:none;max-width:none}
  #tv:not([hidden]) ~ #toast{top:calc(var(--top) + 108px + (100vw - 24px) * .5625 + 50px)}   /* yayın penceresinin altına */
}
/* ===== 1.8 arayüz: daha sade bar, fotoğraflı kart ve liste ===== */
.bar{padding:6px 8px 6px 14px;gap:12px;background:linear-gradient(180deg,rgba(12,19,31,.88),rgba(8,12,20,.82))}
.bmark{width:18px;height:18px;border-radius:50%;flex:none;align-self:center;margin-right:2px;
  background:radial-gradient(circle at 50% 50%,#c8f5ff 0 1.5px,transparent 2px),repeating-radial-gradient(circle,rgba(140,228,255,.55) 0 1px,transparent 1px 4px);
  box-shadow:0 0 0 1px rgba(140,228,255,.35),0 0 12px rgba(140,228,255,.35)}
.brand{align-items:center}
.brand b{font-size:14px;letter-spacing:.24em}
.brand span{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:10px;letter-spacing:.08em}
.live{border-left:1px solid var(--line);padding-left:12px}
.chips{top:calc(var(--top) + 62px)}
#panel{top:calc(var(--top) + 104px)}
#list li > button{grid-template-columns:2px 1fr auto}
#list .k{grid-row:span 2}
#list .th{grid-column:3;grid-row:1 / span 2;width:58px;height:44px;object-fit:cover;border-radius:7px;align-self:center;background:#0a1220;border:1px solid var(--line)}
#list .m{grid-column:2}
/* kart fotoğraf galerisi */
#card{width:390px;grid-auto-rows:max-content;align-content:start}
.media{display:grid;gap:8px;margin:0 -4px}
.media .hero{position:relative;margin:0;border-radius:11px;overflow:hidden;aspect-ratio:16/10;background:#08101b;border:1px solid var(--line)}
.media .hero img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;animation:mIn .5s ease}
@keyframes mIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.media figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 9px;font:400 11px/1.4 var(--f-ui);color:#e9f3fa;
  background:linear-gradient(transparent,rgba(3,6,10,.88));display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.media .mk{font:500 9.5px var(--f-data);letter-spacing:.16em;text-transform:uppercase;color:var(--signal);margin-right:8px}
.media .cnt{position:absolute;top:8px;right:8px;font:500 10px var(--f-data);letter-spacing:.08em;padding:3px 7px;border-radius:999px;background:rgba(3,6,10,.7);border:1px solid var(--line)}
.media .thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.media .thumbs::-webkit-scrollbar{display:none}
.media .thumbs button{flex:none;width:62px;height:44px;padding:0;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:#08101b;cursor:pointer;opacity:.6;transition:opacity .2s,border-color .2s}
.media .thumbs button[aria-current="true"]{opacity:1;border-color:var(--signal);box-shadow:0 0 10px var(--signal-glow)}
.media .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.sk{background:linear-gradient(100deg,#0a1422 30%,#12233a 50%,#0a1422 70%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:760px){
  #card{width:auto}
  .media .hero{aspect-ratio:2/1}
  .media .thumbs{display:none}
  #card > *{order:3}
  #card > .ctop{order:0}
  #card > h2{order:1}
  #card > .media{order:2}
  .bmark{width:16px;height:16px}
}
/* ===== 1.9: giriş ekranının dili (Jost, noktalı küre, Büyük Ayı) + taşınabilir haber paneli ===== */
.bar{left:50%;right:auto;transform:translateX(-50%);width:min(760px, calc(100% - 24px));padding:6px 6px 6px 10px;gap:12px;border-radius:999px;
  background:rgba(6,9,14,.78);border-color:rgba(150,232,255,.18);box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 0 18px rgba(120,215,250,.05)}
.brand{gap:10px}
.mlogo{width:32px;height:32px;flex:none;display:block}
.brand b{font:300 15px/1 "Jost","Archivo",sans-serif;letter-spacing:.46em;color:#eef1f4;padding-left:.1em}
.live{border:0;padding:0;gap:7px;font:500 10px var(--f-data);letter-spacing:.3em;color:var(--soft)}
.nbtn{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font:500 11px var(--f-data);letter-spacing:.3em;text-transform:uppercase;color:#e9fbff;
  padding:9px 18px 9px 14px;border-radius:999px;background:rgba(120,215,250,.08);border:1px solid rgba(150,232,255,.5);
  box-shadow:0 0 14px rgba(120,215,250,.25), inset 0 0 10px rgba(120,215,250,.1);transition:background .2s, box-shadow .2s}
.nbtn:hover,.nbtn[aria-pressed="true"]{background:rgba(120,215,250,.18);box-shadow:0 0 26px rgba(120,215,250,.55), inset 0 0 14px rgba(120,215,250,.22)}
.nb-i{width:12px;height:10px;background:linear-gradient(currentColor 0 0) 0 0/100% 1.5px no-repeat,linear-gradient(currentColor 0 0) 0 50%/70% 1.5px no-repeat,linear-gradient(currentColor 0 0) 0 100%/85% 1.5px no-repeat}
#listBtn{display:inline-flex!important}
/* panel */
#panel{position:fixed!important;transform:none!important;z-index:6;right:auto!important;bottom:auto!important;display:flex;flex-direction:column;padding:0!important;
  border-radius:18px!important;border:1px solid rgba(150,232,255,.2)!important;background:rgba(6,9,14,.86)!important;
  box-shadow:0 18px 60px rgba(0,0,0,.55), inset 0 0 30px rgba(120,215,250,.04)!important;overflow:hidden;opacity:1!important;pointer-events:auto!important}
#panel[hidden]{display:none!important}
#panel.dragging{box-shadow:0 24px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(150,232,255,.45)!important}
#panel .phead{display:flex!important;align-items:center;gap:10px;padding:10px 10px 10px 12px!important;cursor:grab;touch-action:none;user-select:none;
  border-bottom:1px solid rgba(150,232,255,.12)!important;
  background:radial-gradient(circle,rgba(170,225,255,.16) .8px,transparent 1.2px) 0 0/9px 9px, linear-gradient(180deg,rgba(14,26,40,.6),transparent)}
#panel.dragging .phead{cursor:grabbing}
#panel .mlogo{width:24px;height:24px}
.ptitle{font:300 13px/1 "Jost","Archivo",sans-serif;letter-spacing:.38em;text-transform:uppercase;color:#eef1f4}
.pcount{font:500 10px var(--f-data);color:var(--signal);border:1px solid rgba(150,232,255,.3);border-radius:999px;padding:2px 8px}
#panel .x{margin-left:auto;font-size:22px}
#panel .chips{position:static!important;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:10px 12px 4px;opacity:1!important;pointer-events:auto!important}
#panel .chip{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(5,9,15,.6)}
.psearch{padding:6px 12px 8px}
.psearch #q{width:100%;padding:8px 12px;font-size:12.5px;border-radius:999px}
#panel #list{flex:1;min-height:0;overflow-y:auto;padding:2px 0 6px;overscroll-behavior:contain}
#panel #list li > button{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;align-items:start;padding:11px 14px 11px 14px;
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#panel #list .k{grid-row:auto;width:9px;height:9px;min-height:0;border-radius:50%;margin-top:4px;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent), 0 0 10px var(--c)}
.tw{display:grid;gap:3px;min-width:0;grid-template-columns:minmax(0,1fr)}
#panel #list .tw > *{grid-column:1;grid-row:auto}
#panel #list .ago{grid-column:3;grid-row:1}
#panel #card .acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#panel #card .act{min-width:0;padding:10px 8px;font-size:10.5px;letter-spacing:.1em}
#panel #list .t{font:600 13.5px/1.32 var(--f-ui);color:#fff;-webkit-line-clamp:3}
#panel #list .d{font:400 12px/1.42 var(--f-ui);color:var(--soft);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#panel #list .m{font:400 10px var(--f-data);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ago{font:500 10.5px var(--f-data);color:var(--signal);white-space:nowrap;padding-top:2px;text-align:right;display:grid;gap:3px;justify-items:end}
.ago .new{font-size:9px;letter-spacing:.14em;color:#fff;background:rgba(229,72,77,.85);border-radius:4px;padding:1px 5px}
#panel #list li.open{background:rgba(125,216,255,.05);box-shadow:inset 2px 0 0 var(--signal)}
#panel #list li.open > button{background:none}
.phint{padding:7px 12px calc(var(--bot) + 8px);font:400 9.5px var(--f-data);letter-spacing:.1em;color:var(--mute);border-top:1px solid rgba(150,232,255,.1);text-align:center}
/* haber bölmesi: listenin içinde açılır */
#panel #card{position:static!important;inset:auto!important;width:auto!important;max-height:none!important;transform:none!important;margin:0 12px 12px 36px;padding:12px!important;
  border-radius:12px!important;opacity:1!important;pointer-events:auto!important;box-shadow:none!important;background:rgba(10,17,28,.9)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#panel #card > h2{display:none}
#panel #card .ctop .x{display:none}
#panel #card .media .hero{aspect-ratio:16/10}
#panel #card .media .thumbs{display:flex}
#panel #card > *{order:0}
@media (max-width:760px){
  .bar{width:calc(100% - 16px);top:calc(var(--top) + 8px)}
  .brand b{font-size:12px;letter-spacing:.32em}
  .mlogo{width:26px;height:26px}
  .live{display:none}
  .nbtn{padding:8px 13px 8px 11px;letter-spacing:.18em}
  #panel #card{margin:0 8px 10px 26px}
  #panel #list li > button{padding:11px 12px}
}
/* yakınlaşmadan çıkış: her zaman görünür */
#hudExit{left:50%!important;right:auto!important;transform:translateX(-50%);bottom:calc(var(--bot) + 22px)!important;z-index:2;
  font:600 12px var(--f-data)!important;letter-spacing:.24em!important;color:#fff!important;padding:13px 26px!important;border-radius:999px!important;
  background:rgba(8,14,22,.88)!important;border:1px solid rgba(150,232,255,.75)!important;box-shadow:0 0 22px rgba(120,215,250,.5), inset 0 0 12px rgba(120,215,250,.2)!important}
#hudExit:hover{background:rgba(120,215,250,.2)!important}
.hud-prog{bottom:calc(var(--bot) + 86px)!important}
#hud{z-index:7}
/* ===== nişan: küçük, ince, uzun kollu artı; yalnızca yakınlaşırken görünür, varınca yavaşça kaybolur ===== */
.xh{position:absolute;left:50%;top:50%;width:min(46vmin,230px);height:min(46vmin,230px);transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .5s ease}
#hud.go .xh{opacity:1}
#hud.arrived .xh{opacity:0;transition:opacity 1.8s ease .5s}
.xh i{position:absolute;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.xh .h{top:50%;height:1px;margin-top:-.5px}
.xh .v{left:50%;width:1px;margin-left:-.5px}
.xh .l{left:0;right:calc(50% + 8px);transform-origin:right center;transform:scaleX(0);background:linear-gradient(90deg,transparent,rgba(240,248,255,.85))}
.xh .r{right:0;left:calc(50% + 8px);transform-origin:left center;transform:scaleX(0);background:linear-gradient(270deg,transparent,rgba(240,248,255,.85))}
.xh .t{top:0;bottom:calc(50% + 8px);transform-origin:center bottom;transform:scaleY(0);background:linear-gradient(180deg,transparent,rgba(240,248,255,.85))}
.xh .b{bottom:0;top:calc(50% + 8px);transform-origin:center top;transform:scaleY(0);background:linear-gradient(0deg,transparent,rgba(240,248,255,.85))}
.xh .c{left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(140,228,255,.9)}
#hud.go .xh .h, #hud.go .xh .v{transform:none}
.xh{filter:drop-shadow(0 0 2px rgba(0,0,0,.6))}
@media (prefers-reduced-motion:reduce){.xh i{transition:none}}
#panel .net-chip i{width:14px;height:8px;border-radius:0;background:none;
  background:linear-gradient(20deg,transparent 45%,#ff3b3b 46% 54%,transparent 55%),radial-gradient(circle,#ff3b3b 0 2px,transparent 2.5px) 0 100%/5px 5px no-repeat,radial-gradient(circle,#ff3b3b 0 2px,transparent 2.5px) 100% 0/5px 5px no-repeat}
#panel .net-chip[aria-pressed="true"]{border-color:rgba(255,59,59,.7);box-shadow:0 0 12px rgba(255,59,59,.3)}
/* ===== ZOOM IN / ZOOM OUT: açılıştaki OPEN düğmesiyle aynı, ekranda parlayan büyük düğmeler ===== */
.bigbtn, #hud #hudExit{position:fixed;left:50%!important;right:auto!important;transform:translateX(-50%);bottom:calc(var(--bot) + 28px)!important;z-index:9;
  font:500 13px var(--f-data)!important;letter-spacing:.5em!important;padding:13px 26px 13px calc(26px + .5em)!important;color:#e9fbff!important;cursor:pointer;
  background:rgba(120,215,250,.08)!important;border:1px solid rgba(150,232,255,.65)!important;border-radius:999px!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 18px rgba(120,215,250,.35), inset 0 0 12px rgba(120,215,250,.15)!important;white-space:nowrap;
  animation:bigIn .8s ease both, spOpenPulse 2.4s .8s ease-in-out infinite;transition:background .2s}
.bigbtn:hover,.bigbtn:focus-visible,#hud #hudExit:hover{background:rgba(120,215,250,.18)!important;box-shadow:0 0 30px rgba(120,215,250,.6), inset 0 0 14px rgba(120,215,250,.25)!important;outline:none}
@keyframes bigIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
#hud .hud-prog{bottom:calc(var(--bot) + 92px)!important}
@media (max-width:760px){ .bigbtn{bottom:auto!important;top:calc(var(--top) + 70px)} }
/* ===== İndir: uygulamayı ana ekrana kurar ===== */
.nbtn.dl{border-color:rgba(150,232,255,.75);animation:spOpenPulse 2.4s ease-in-out infinite}
.dl-i{width:11px;height:12px;background:linear-gradient(currentColor 0 0) 50% 0/1.5px 8px no-repeat,linear-gradient(currentColor 0 0) 0 100%/100% 1.5px no-repeat;position:relative}
.dl-i::after{content:"";position:absolute;left:50%;top:4px;width:5px;height:5px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateX(-50%) rotate(45deg)}
#iosGuide{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,5,8,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px}
.ig-box{position:relative;width:min(380px,100%);background:rgba(8,13,20,.95);border:1px solid rgba(150,232,255,.3);border-radius:18px;padding:22px;display:grid;justify-items:center;gap:12px;text-align:left}
.ig-logo{width:64px!important;height:64px!important}
.ig-box h3{margin:0;font:300 16px "Jost","Archivo",sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#eef1f4}
.ig-box ol{margin:0;padding-left:20px;display:grid;gap:8px;font:400 14px/1.45 var(--f-ui);color:var(--soft)}
.ig-box b{color:#fff}
.ig-share{display:inline-block;width:12px;height:14px;vertical-align:-2px;border:1.5px solid var(--signal);border-top:0;border-radius:0 0 2px 2px;position:relative;margin:0 2px}
.ig-share::before{content:"";position:absolute;left:50%;top:-6px;width:1.5px;height:10px;background:var(--signal);transform:translateX(-50%)}
.ig-ok{margin-top:8px;font:500 13px var(--f-data);letter-spacing:.5em;padding:12px 30px 12px calc(30px + .5em);color:#e9fbff;cursor:pointer;
  background:rgba(120,215,250,.08);border:1px solid rgba(150,232,255,.65);border-radius:999px;box-shadow:0 0 18px rgba(120,215,250,.35), inset 0 0 12px rgba(120,215,250,.15)}
@media (max-width:760px){ .nbtn.dl{padding:8px 11px} .nbtn.dl span:last-child{display:none} }
/* ===== 2.2: elde tutulan haber kartı ===== */
#card.held{position:fixed!important;right:auto!important;z-index:8!important;transform:none;margin:0!important;padding:16px 18px 18px!important;overflow-y:auto!important;
  background:linear-gradient(180deg,rgba(14,24,38,.97),rgba(7,12,20,.97))!important;border:1px solid rgba(150,232,255,.35)!important;border-radius:20px!important;

@keyframes ping{0%{transform:scale(1);opacity:.55}70%{transform:scale(3.3);opacity:0}100%{transform:scale(3.3);opacity:0}}

.gx{position:relative;display:inline-block;background:linear-gradient(96deg,#ffffff 0%,#f6fdff 45%,#d3f7ff 80%,#b4f0fc 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

<body class="splashing">
<div id="splash" aria-hidden="true">
  <canvas id="spStarsBase"></canvas>
  <canvas id="spStars"></canvas>
  <canvas id="spCanvas"></canvas>

<script>
/* [2.3] Giriş ekranı ayrı betikte: harita kütüphanesi (≈4 MB) inerken bile anında görünür ve canlanır */
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SPLASH_MS = REDUCED ? 800 : 2550; window.SPLASH_MS = SPLASH_MS;   // [2.6] Büyük Ayı'nın son çizgisi tamamlandığı an
// [2.4] OPEN harita kütüphanesini beklemez: süresi gelince her zaman görünür. Kütüphane henüz inmediyse basış hatırlanır, hazır olunca kendiliğinden açılır.
setTimeout(() => { const b = $("spOpen"); if (b && b.hidden) { b.hidden = false; try { b.focus({ preventScroll: true }); } catch {} } }, SPLASH_MS);
$("spOpen").addEventListener("click", () => { if (window.WM_OPEN) return; window.WM_WANT_OPEN = true; $("spOpen").classList.add("wait"); });
(() => {   // giriş: ekranı kaplayan, hafifçe parıldayan yıldız tozu
  const cv = $("spStars"), g = cv.getContext("2d"), dpr = Math.min(1.5, window.devicePixelRatio || 1);   // [2.3] 2 → 1.5
  const fit = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  fit(); addEventListener("resize", fit);
  let sd = 11; const r = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
  const st = [...Array(420)].map(() => ({ x: r(), y: r(), a: r(), c: r() < 0.25, p: r() * 6.28 }));
  const BASE = $("spStarsBase");                                     // [2.3] sabit katman ekranda ayrı tuval: bir kez çizilir, her karede kopyalanmaz
  const paintBase = () => { BASE.width = cv.width; BASE.height = cv.height; const b = BASE.getContext("2d"); b.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = b.createRadialGradient(innerWidth / 2, innerHeight * 0.42, 0, innerWidth / 2, innerHeight * 0.42, Math.max(innerWidth, innerHeight) * 0.75);
    bg.addColorStop(0, "#070c11"); bg.addColorStop(0.55, "#04070a"); bg.addColorStop(1, "#020304");   // [2.6] derin siyah b.fillStyle = bg; b.fillRect(0, 0, innerWidth, innerHeight);
    for (const s2 of st) if (s2.a < 0.8) { b.fillStyle = s2.c ? `rgba(120,215,240,${0.15 + s2.a * 0.3})` : `rgba(225,238,250,${0.08 + s2.a * 0.35})`; b.beginPath(); b.arc(s2.x * innerWidth, s2.y * innerHeight, 0.6, 0, 6.283); b.fill(); } };

  const tw = st.filter((s2) => s2.a >= 0.8);                           // yalnız parlak yıldızlar parıldar (~80 tane)
  let lastS = 0;
  window.__spStars = (now) => {                                      // [2.3] kendi döngüsü yok: ana splash döngüsünden çağrılır (tek rAF)

function sizeOf(ev) { if (ev.count) return Math.min(13, 7 + Math.log2(ev.count + 1) * 0.8); return 7; }

const integrityWarn = (ev, why) => console.warn("Veri bütünlüğü hatası engellendi:", ev.id, ev.title, why ? "(" + why + ")" : "");
const SIM_STOP = new Set("the a an and or but of in on at to for from with by as is are was were be been has have had its it this that these those after before over under into about amid says said say will would could new more than also just not no".split(" "));
const simTokens = (t) => new Set(norm(String(t || "")).replace(/[^\p{L}\p{N}\s]/gu, " ").split(/\s+/).filter((w) => w.length > 3 && !SIM_STOP.has(w)).map((w) => w.slice(0, 5)));
// Başlık kelimelerinin içerikte bulunma oranı (kök: ilk 5 harf). İçerik çok kısaysa karar verilmez.
function titleContentSimilarity(title, content) {
  const a = simTokens(title), b = simTokens(content);
  if (a.size < 3 || b.size < 6) return 1;
  let hit = 0; for (const w of a) if (b.has(w)) hit++;
  return hit / a.size;
}
function isTitleContentMismatch(ev, content) {
  const c = content ?? (ev.description || (ev.lead || []).join(" "));
  return titleContentSimilarity(ev.title, c) < 0.4;
}

let hlsLib = null;
async function openTV(kind, id, title) {

  let link = "";
  if (kind === "yt") {
    box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    link = "https://www.youtube.com/watch?v=" + encodeURIComponent(id);
  } else if (kind === "ch") {
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(id)}&autoplay=1&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;

      try { const Hls = await hlsLib; const h = new Hls(); h.loadSource(id); h.attachMedia(v); } catch { v.src = id; }
    }

}

/* ---------- Daha fazla bilgi: Wikipedia arka planı + bölgedeki olaylar ---------- */
function moreHTML(ev) {
  const m = ev.more?.[LANG];
  const near = [...S.events.values()].filter((o) => o.id !== ev.id && CATS[o.cat] &&
    ((ev.g && o.g === ev.g) || (Math.abs(o.lat - ev.lat) < 3 && Math.abs(o.lon - ev.lon) < 3)))
    .sort((a, b) => (b.aktif - a.aktif) || (b.time || 0) - (a.time || 0)).slice(0, 5);
  let h = "";
  // 1) Haberin kendisi: ilk paragraf giriş (büyük), devamı düzgün paragraflar
  let paras = [];
  if (ev.lead?.length) {
    const L2 = ev.leadTx?.[LANG];
    if (!L2) ensureLeadTx(ev);
    paras = (L2 || ev.lead).map(cleanPara).filter((p) => p.length > 40);
  }
  if (!paras.length) { const d = cleanPara(ev.description || ev.ctx || ""); if (d.length > 60 && norm(d).slice(0, 50) !== norm(ev.title).slice(0, 50)) paras = [cutAt(d, 600)]; }
  h += `<div class="sec"><h3>${esc(T("fromArticle"))}${ev.domain ? " · " + esc(ev.domain) : ""}</h3>`;
  if (paras.length) h += `<p class="lede">${esc(paras[0])}</p>` + paras.slice(1).map((p) => `<p class="par">${esc(p)}</p>`).join("");
  else h += `<span class="wait">${esc(deepable(ev) && !ev.deep ? "Reading the report…" : T("searching"))}</span>`;
  h += `</div>`;
  // 2) Aynı olayı veren diğer kaynaklar: her birinden haberin özünü taşıyan bir paragraf
  if (ev.rel?.length) h += `<div class="sec"><h3>Other outlets report</h3>${ev.rel.map((r) => `<blockquote>${esc(r.text)}<cite><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.host)} ↗</a></cite></blockquote>`).join("")}</div>`;
  else if (ev.relBusy) h += `<div class="sec"><h3>Other outlets report</h3><span class="wait">${esc(T("searching"))}</span></div>`;
  // 3) Arka plan (Wikipedia)
  h += `<div class="sec"><h3>${esc(T("bg"))}</h3>`;
  if (!m) h += `<span class="wait">${esc(T("searching"))}</span>`;
  else if (!m.length) h += `<p class="wait">${esc(T("noMore"))}</p>`;
  else h += m.map((w) => `<div class="wk">${w.img ? `<img src="${esc(w.img)}" alt="">` : ""}<b>${esc(w.title)}</b><p>${esc(cutAt(w.text, 700))}</p><a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(T("readWiki"))}</a></div>`).join("");
  h += `</div>`;
  if (near.length) h += `<div class="sec"><h3>${esc(T("nearby"))}</h3><ul>${near.map((o) => `<li><button data-go="${esc(o.id)}">${esc(titleOf(o))}<small>${esc(T(o.cat))} · ${esc(T(o.aktif ? "on" : "off"))} · ${esc(when(o))}</small></button></li>`).join("")}</ul></div>`;
  const arts = ev.articles?.length ? ev.articles : ev.url ? [{ url: ev.url, title: ev.domain || ev.source }] : [];
  if (arts.length) h += `<div class="sec"><h3>${esc(T("srcs"))}</h3><ul>${arts.slice(0, 10).map((a) => `<li><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(hostOf(a.url) || a.title)} ↗</a></li>`).join("")}</ul></div>`;
  return h;
}
// Diğer kaynakların metninden, ana haberde olmayan en bilgilendirici paragraf (en fazla 2 kaynak)
async function loadRelated(ev) {
  if (ev.rel || ev.relBusy) return;
  const mainHost = hostOf(ev.url || "");
  const cands = (ev.articles || []).filter((a) => a.url && a.url !== ev.url && hostOf(a.url) !== mainHost && deepable({ url: a.url }))
    .filter((a, i, arr) => arr.findIndex((b) => hostOf(b.url) === hostOf(a.url)) === i).slice(0, 2);
  if (!cands.length) { ev.rel = []; return; }
  ev.relBusy = true; if (S.sel === ev.id && ev.moreOpen) refreshMore(ev);
  const have = simTokens((ev.lead || []).join(" ") + " " + ev.title), out = [];
  for (const a of cands) {
    try {
      const ps = leadParas(await readArticle(a.url), 4);
      const best = ps.find((p) => { const t = simTokens(p); let k = 0; for (const w of t) if (have.has(w)) k++; return t.size > 6 && k / t.size < 0.7; }) || ps[0];
      if (best) out.push({ host: hostOf(a.url), url: a.url, text: cutAt(best, 520) });

}

const GENERIC_T = /^(climate change|global warming|war|protest|demonstration|riot|election|terrorism|homicide|murder|shooting|police|military|government|politics|economy|inflation|earthquake|flood|wildfire|special report on global warming.*|united nations|european union|nato)$/i;
const GENERIC_W = new Set("monday tuesday wednesday thursday friday saturday sunday january february march april may june july august september october november december reuters associated press afp the this that police officials government president minister".split(" "));
const STOP = new Set("the a an of in on at to for and or with by from as is are was were be has have had its it this that over after amid says said new".split(" "));
async function wikiSearch(q) {
  const words = q.replace(/[^\p{L}\p{N}\s-]/gu, " ").split(/\s+/).filter((w) => w.length > 2 && !STOP.has(w.toLowerCase())).slice(0, 9).join(" ");
  const j = await getJSON("https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&formatversion=2&origin=*&srlimit=3&srsearch=" + encodeURIComponent(words), 10000);
  return (j.query?.search || []).map((r) => r.title);
}
async function wikiSummary(title, lang) {
  const enc = encodeURIComponent(title.replace(/ /g, "_"));
  const en = await getJSON("https://en.wikipedia.org/api/rest_v1/page/summary/" + enc, 10000);
  if (!en || en.type === "disambiguation" || !en.extract) return null;
  let out = { title: en.title, text: en.extract, url: en.content_urls?.desktop?.page, img: en.thumbnail?.source };
  return out;
}
async function loadMore(ev) {
  const lang = LANG;
  ev.more = ev.more || {};
  ensureLeadTx(ev); loadRelated(ev);                            // [2.4] diğer kaynakların paragrafları
  if (ev.more[lang]) return;
  // Olaya özgü varlıklar: başlık ve haber metnindeki özel adlar (kişi, kurum, yer, olay)
  const ents = new Set((ev.title + " " + (ev.lead || []).join(" ")).match(/\b\p{Lu}[\p{L}'’-]{3,}/gu)?.map((w) => norm(w)).filter((w) => !STOP.has(w) && !GENERIC_W.has(w)) || []);
  const specific = (t) => !/^(list of|timeline of|outline of|index of)/i.test(t) && !GENERIC_T.test(t) && !isCountryTitle(t);
  let titles = (ev.links || []).filter((t) => !GAZ.some((g) => norm(g.en) === norm(t) || norm(g.ad) === norm(t))).filter(specific).slice(0, 4);
  if (titles.length < 2 && ents.size) {
    try {
      const found = await wikiSearch([...ents].slice(0, 6).join(" "));
      titles = [...titles, ...found.filter(specific).filter((t) => norm(t).split(/\s+/).some((w) => ents.has(w)))];
    } catch {}
  }
  const out = [], seen = new Set();
  for (const t of titles) {
    if (out.length >= 2) break;
    try { const s = await wikiSummary(t, lang); if (s && !seen.has(s.title)) { seen.add(s.title); out.push(s); } } catch {}
  }
  ev.more[lang] = out;
  if (S.sel === ev.id && ev.moreOpen && LANG === lang) refreshMore(ev);
}

/* ---------- Hedefleme sistemi (Yaklaştır) ---------- */
function dms(lat, lon) {
  const f = (v, p, n) => { const t = Math.round(Math.abs(v) * 3600), d = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;   // [2.3] 59.6" → 60" hatası yok
    return `${String(d).padStart(p, "0")}°${String(m).padStart(2, "0")}'${String(s).padStart(2, "0")}"${n}`; };
  return `${f(lat, 2, lat >= 0 ? T("N") : T("S"))} ${f(lon, 3, lon >= 0 ? T("E") : T("W"))}`;
}
let mission = 0, hudEv = null;
const hud = $("hud"), hudRead = $("hudRead"), prog = [...$("hudProg").children];
function readout() {
  if (hud.hidden || !hudEv) return;
  const h = viewer.camera.positionCartographic.height;
  const alt = h > 10000 ? `${Math.round(h / 1000).toLocaleString(loc())} km` : `${Math.round(h).toLocaleString(loc())} m`;
  hudRead.textContent = `${T("alt")} ${alt}   ·   ${dms(hudEv.lat, hudEv.lon)}`;
}
scene.postRender.addEventListener(readout);
const flyP = (o) => new Promise((res) => viewer.camera.flyTo({ ...o, complete: () => res(true), cancel: () => res(false) }));
const flySphereP = (bs, o) => new Promise((res) => viewer.camera.flyToBoundingSphere(bs, { ...o, complete: () => res(true), cancel: () => res(false) }));
function step(i, dur) { prog.forEach((p, j) => { p.style.setProperty("--d", dur + "s"); p.classList.toggle("f", j <= i); }); }
// [2.3] İlerleme çubuğu kamera uçuşuyla aynı süreyi paylaşır: 3 adım eşit dilimlerde, görev değişirse zamanlayıcılar iptal edilir
let progT = [];
function progFor(totalSec, run) {
  progT.forEach(clearTimeout); progT = [];
  const d = totalSec / 3;
  step(0, d);
  progT.push(setTimeout(() => run === mission && step(1, d), d * 1000), setTimeout(() => run === mission && step(2, d), 2 * d * 1000));
}

// [2.4] Olayın TAM yeri: haber metni okunur (tarih satırı, mekân, kurum), sonuç beklenir; ülke ya da başkent kadrajı yok, her zaman binalara inilir.
async function sharpen(ev) {
  if (ev.prec === "exact" || ev.prec === "inst" || ev.prec === "city" || !ev.g) return;
  const ctry = countryOf(ev.g); if (!ctry) return;
  const text = ev.title + " " + (ev.ctx || "") + " " + (ev.lead || []).slice(0, 2).join(" ");
  const inst = await institution(ctry, topicOf(text, ev.cat));
  if (inst && !inst.city) applyRef(ev, { lat: inst.lat, lon: inst.lon, prec: "inst", spot: inst.name, why: [["inst", inst.name]] });
  else if (inst && ev.prec === "country") applyRef(ev, { lat: inst.lat, lon: inst.lon, prec: "capital", spot: `${inst.name}, ${ctry.en}`, why: [["capital", inst.name]] });
}
async function pinpoint(ev, run) {
  zBusy = ev.id; syncZoomBtn();
  $("hudCoord").textContent = "Reading the report · locating the exact site";
  try { await Promise.race([(async () => { try { await refineOne(ev); } catch {} try { await deepLocate(ev); } catch {} await sharpen(ev); })(), sleep(24000)]); } catch {}
  if (zBusy === ev.id) { zBusy = ""; syncZoomBtn(); }
  if (run === mission) { $("hudName").textContent = placeName0(ev) || $("hudName").textContent; $("hudCoord").textContent = dms(ev.lat, ev.lon); }
}
const siteRange = (ev) => (ev.prec === "exact" || ev.prec === "inst") ? 420 : (ev.prec === "city" || ev.prec === "capital") ? 1400 : 2600;
async function flySite(ev, dur, apex, run) {
  const ground = await groundAt(ev.lat, ev.lon); if (run !== mission) return false;
  groundRef = ground || 0;
  const range = siteRange(ev);
  const bs = new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(ev.lon, ev.lat, (ground || 0) + 40), 150);
  const o = { offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(range <= 420 ? -38 : -32), range), duration: dur, easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT };
  if (apex) o.maximumHeight = apex;
  ev._flown = { lat: ev.lat, lon: ev.lon };
  loadTiles();
  return flySphereP(bs, o);
}
async function engage(ev) {
  const run = ++mission; hudEv = ev;
  const k = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.35 : 1;
  const name = placeName0(ev) || ev.g?.en || ev.place?.split(",")[0] || T(ev.cat);
  $("hudKick").textContent = `${T(ev.cat)} · ${T(ev.aktif ? "onL" : "offL").replace(/^[●○]\s*/, "")}`;
  $("hudName").textContent = name;
  $("hudCoord").textContent = dms(ev.lat, ev.lon);
  prog.forEach((p) => p.classList.remove("f"));
  progT.forEach(clearTimeout); progT = [];
  document.body.classList.add("engaged"); document.body.classList.remove("arrived");
  if (S.sel !== ev.id) select(ev); else { syncZoomBtn(); placeCard(); }
  if (matchMedia("(max-width:760px)").matches && !PANEL.hidden) setPanel(false);   // telefonda olay yeri görünsün; panel NEWS ile geri açılır
  hud.hidden = false; hud.classList.remove("arrived", "go");
  requestAnimationFrame(() => hud.classList.add("on", "go"));

  const pin = pinpoint(ev, run);
  const top = { heading: 0, pitch: -Math.PI / 2, roll: 0 }, ease = Cesium.EasingFunction.QUADRATIC_IN_OUT;
  const camH = viewer.camera.positionCartographic.height;

    step(0, 2.0 * k);

    if (run !== mission) return;

    // Zaten yakındayız: yer kesinleşince dünyaya çıkmadan, mesafe kadar yükselip doğrudan süzül
    step(0, 1.2);
    await pin; if (run !== mission) return;
    const here = lookPoint() || { lat: Cesium.Math.toDegrees(viewer.camera.positionCartographic.latitude), lon: Cesium.Math.toDegrees(viewer.camera.positionCartographic.longitude) };
    const d = km(here, ev), dur = Math.min(5.5, Math.max(2.6, 2.2 + d / 700)) * k, apex = Math.min(1600000, Math.max(4000, d * 1000 * 0.38));

}

/* ---------- Görünürlük: dünyanın arka yüzü gizli, liste yalnızca ekrandaki bölgeyi gösterir ---------- */
const scratch2 = new Cesium.Cartesian2();
function computeVis(withList = true) {
  const occ = new Cesium.EllipsoidalOccluder(Cesium.Ellipsoid.WGS84, viewer.camera.positionWC);
  const w = scene.canvas.clientWidth, h = scene.canvas.clientHeight;
  for (const ev of S.events.values()) {
    const p = Cesium.Cartesian3.fromDegrees(ev.lon, ev.lat, 0);
    const vis = occ.isPointVisible(p);
    let inView = false;
    if (vis) { const c = scene.cartesianToCanvasCoordinates(p, scratch2); inView = !!c && c.x >= 0 && c.y >= 0 && c.x <= w && c.y <= h; }
    ev.vis = vis; ev.inView = inView;
    const on = vis && matches(ev), e = S.ents.get(ev.id);
    if (e) e.show = vis;
    for (const x of [...(ev.ring || []), ev.halo].filter(Boolean)) x.show = on;
  }
  if (withList) renderList();
  scene.requestRender();
}
let visT = 0;
viewer.camera.changed.addEventListener(() => { clearTimeout(visT); visT = setTimeout(() => computeVis(false), 300); });   // [2.3] 150 → 300 ms

  const j = await getJSONany("https://freenewsapi.ai/v1/search?q=conflict,protest,earthquake,attack&date=24h&size=30&sort=date", 15000);
  return pickArr(j).map((a) => newsItem("fn", { title: a.title, desc: a.description || a.summary, url: a.url || a.link,
    time: toTime(a.published_at || a.publishedAt || a.date), domain: a.host || a.source?.name || a.source || hostOf(a.url || ""),
    hint: a.country || "", imgs: [a.image || a.image_url || a.urlToImage].filter(Boolean).map((u) => ({ src: u, cap: "" })) }, "FreeNewsApi")).filter(Boolean);
}
async function loadNewsline() {
  const j = await getJSONany("https://news.heyitsmejosh.com/api/stories?limit=120", 15000);
  return pickArr(j).map((a) => newsItem("nl", { title: a.title || a.headline, desc: a.description || a.summary || "", url: a.url || a.link,
    time: toTime(a.ts ?? a.time ?? a.published), domain: a.outlet || a.source || hostOf(a.url || "") }, "Newsline")).filter(Boolean);
}
// USGS: son 24 saatin M4.5+ depremleri (aylık M2.5 listesi 24 saat kuralını bozar ve hissedilmeyen küçük sarsıntılarla haritayı doldurur)
async function loadUSGS() {
  const j = await getJSON("https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson", 15000);
  return (j.features || []).filter((f) => f.geometry?.coordinates && Date.now() - f.properties.time < MAX_AGE).map((f) => {
    const p = f.properties, [lon, lat] = f.geometry.coordinates;
    return { id: "q:" + f.id, cat: "afet", title: `M${(+p.mag).toFixed(1)} earthquake: ${p.place || "unknown location"}`, place: p.place || "",
      time: p.time, lat, lon, url: p.url, alertLv: p.alert ? p.alert[0].toUpperCase() + p.alert.slice(1) : "", active: Date.now() - p.time < 6 * 3600e3,
      prec: "exact", domain: "USGS", source: "USGS" };
  });
}
const refreshAll = () => { run("gdacs", loadGDACS); run("eonet", loadEONET); run("wiki", loadWiki); run("rss", loadRSS); run("fnews", loadFreeNews); run("nline", loadNewsline); run("usgs", loadUSGS); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) { run("gdacs", loadGDACS); watchWiki(); } });
