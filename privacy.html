<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorldMind Privacy</title>
<meta name="theme-color" content="#020304">
<link rel="icon" type="image/png" href="wm-icon-192.png">
<style>
:root{--bg:#020304;--panel:rgba(7,12,18,.92);--line:rgba(140,228,255,.18);--fg:#e8f1f6;--soft:#b9c8d2;--mute:#7f95a3;--cy:#7fdcf5;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 "Inter",system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Arabic","Noto Sans SC",sans-serif}
body{background:radial-gradient(ellipse at 50% -10%,rgba(60,170,210,.12),transparent 55%),var(--bg);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 56px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:22px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font:300 15px/1 "Jost","Inter",sans-serif;letter-spacing:.46em;color:#eef4f8;text-shadow:0 0 14px rgba(125,216,255,.45);direction:ltr}
.langs{margin-inline-start:auto;display:flex;flex-wrap:wrap;gap:4px}
.langs button{font:500 12.5px/1 inherit;font-family:inherit;color:var(--soft);background:rgba(150,172,196,.07);border:1px solid rgba(150,232,255,.14);border-radius:999px;padding:7px 11px;cursor:pointer}
.langs button[aria-pressed="true"]{color:#fff;border-color:rgba(140,228,255,.6);background:rgba(70,205,245,.2)}
.langs button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
h1{margin:6px 0 0;font:700 clamp(26px,5vw,36px)/1.15 "Inter",system-ui,sans-serif;letter-spacing:-.02em;text-wrap:balance}
.upd{margin:0;color:var(--mute);font-size:13px;letter-spacing:.04em}
.lead{margin:0;font-size:17.5px;color:#f3f8fb;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
main{display:grid;gap:20px}
section{display:grid;gap:8px}
h2{margin:0;font:600 12px/1.3 ui-monospace,"IBM Plex Mono",Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
p,li{margin:0;color:var(--soft)}
ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
footer{color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
[dir="rtl"] body{text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="brand">WORLDMIND</span><nav class="langs" id="langs" aria-label="Language"></nav></header>
  <main id="doc"></main>
  <footer>© 2026 WorldMind</footer>
</div>
<script>

      ["İçerik", "Olaylar, orijinal açık kaynaklarına bağlantılarla birlikte kısa ve olgusal özetler olarak gösterilir. Uygulama sarsıcı görüntüler göstermez."],
      ["Değişiklikler", "Bu politika değişirse yeni hâli bu sayfada yeni tarihiyle yayımlanır."],

      ["Servizi a cui l'app si collega", "Per mostrare la mappa e le notizie, l'app carica contenuti pubblici direttamente da questi servizi: " + SERVICES + ". Come per ogni sito web, questi servizi ricevono il tuo indirizzo IP e informazioni di base sul browser quando viene richiesto un contenuto. WorldMind non invia loro alcuna informazione personale. Valgono le loro informative sulla privacy."],

      ["Сервисы, к которым подключается приложение", "Чтобы показать карту и новости, приложение загружает общедоступный контент напрямую из этих сервисов: " + SERVICES + ". Как и при посещении любого сайта, эти сервисы получают ваш IP-адрес и базовые сведения о браузере при запросе контента. WorldMind не передаёт им никаких персональных данных. Действуют их собственные политики конфиденциальности."],

    lead: "WorldMind ne demande, ne collecte, ne stocke sur des serveurs, ne partage ni ne vend aucune donnée personnelle. Pas de compte, pas de publicité, pas d'analyse, pas de suivi.",

      ["Services utilisés par l'application", "Pour afficher la carte et l'actualité, l'application charge des contenus publics directement depuis ces services : " + SERVICES + ". Comme pour tout site web, ces services reçoivent votre adresse IP et des informations de base sur le navigateur lors des requêtes. WorldMind ne leur envoie aucune information personnelle. Leurs propres politiques de confidentialité s'appliquent."],

  es: { n: "Español", t: "Política de privacidad", u: "Última actualización: 22 de octubre de 2026",

    s: [["保存在你设备上的内容", "为了运行更快，应用只在你的设备上保存少量内容：你的设置（语言、显示选项、卡片大小）以及地点查询和文章摘要的缓存。这些内容不会离开你的设备。你可以随时通过清除应用数据或浏览器的网站数据将其删除。"],
      ["应用连接的服务", "为显示地图和新闻，应用会直接从以下服务加载公开内容：" + SERVICES + "。与访问任何网站一样，请求内容时这些服务会收到你的 IP 地址和基本浏览器信息。WorldMind 不会向它们发送任何个人信息。适用其各自的隐私政策。"],
      ["位置", "WorldMind 不会访问你设备的位置。地图上的点是新闻事件的位置，而不是你的位置。"],
      ["儿童", "WorldMind 是一款综合新闻应用，不面向 13 岁以下儿童。它不会从任何人（包括儿童）处收集数据。"],
      ["内容", "事件以简短、客观的摘要形式展示，并附有原始公开来源的链接。应用不显示血腥暴力内容。"],
      ["变更", "如本政策有变更，新版本将在本页面以新的日期发布。"],
      ["联系方式", "如对本政策有疑问，请通过 WorldMind 在 Google Play 页面上的开发者邮箱联系。"]] },

      ["الخدمات التي يتصل بها التطبيق", "لعرض الخريطة والأخبار يحمّل التطبيق محتوى عامًا مباشرة من هذه الخدمات: " + SERVICES + ". وكما في أي موقع ويب، تتلقى هذه الخدمات عنوان IP الخاص بك ومعلومات أساسية عن المتصفح عند طلب المحتوى. لا يرسل WorldMind إليها أي معلومات شخصية، وتنطبق عليها سياسات الخصوصية الخاصة بها."],

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function pick() {
  const q = new URLSearchParams(location.search).get("lang"); if (D[q]) return q;
  try { const l = JSON.parse(localStorage.getItem("wm-set") || "{}").lang; if (D[l]) return l; } catch {}
  const n = (navigator.language || "en").slice(0, 2); return D[n] ? n : "en";
}
function show(l) {
  const d = D[l]; document.documentElement.lang = l; document.documentElement.dir = l === "ar" ? "rtl" : "ltr"; document.title = "WorldMind · " + d.t;
  document.getElementById("doc").innerHTML = `<h1>${esc(d.t)}</h1><p class="upd">${esc(d.u)}</p><p class="lead">${esc(d.lead)}</p>` +
    d.s.map(([h, p]) => `<section><h2>${esc(h)}</h2><p>${esc(p)}</p></section>`).join("");
  document.querySelectorAll("#langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
}
document.getElementById("langs").innerHTML = Object.entries(D).map(([k, d]) => `<button type="button" data-l="${k}" lang="${k}">${d.n}</button>`).join("");
document.getElementById("langs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { show(b.dataset.l); try { history.replaceState(null, "", "?lang=" + b.dataset.l); } catch {} } });
show(pick());
</script>
</body>
</html>
